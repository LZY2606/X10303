[package]
name = "lsm_review"
version = "0.1.0"
edition = "2021"
description = "层合迹：LSM tombstone、范围删除与压实选择审阅（WAL/memtable/SSTable 压实与墓碑语义）"

[lib]
name = "lsm_review"
path = "src/lib.rs"

[[bin]]
name = "lsm_review"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
sha2 = "0.10"
