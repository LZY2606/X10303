[package]
name = "lsm_tombstone_audit"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4"

[profile.dev]
opt-level = 0

[[bin]]
name = "lsm_tombstone_audit"
path = "src/main.rs"
