[package]
name = "lsm-compaction-review"
version = "0.1.0"
edition = "2021"
description = "层合迹：LSM tombstone、范围删除与压实选择审阅（离线案例包）"

[lib]
name = "lsm_review"
path = "src/lib.rs"

[[bin]]
name = "lsm-review"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
