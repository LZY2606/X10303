[package]
name = "lsm_review"
version = "0.1.0"
edition = "2021"
description = "层合迹: LSM tombstone / range-delete / compaction review workbench"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
