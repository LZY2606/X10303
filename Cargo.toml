[package]
name = "lsm-compaction-review"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "form", "matched-path"] }
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[profile.dev]
panic = "unwind"
