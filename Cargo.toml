[package]
name = "lsm-trace"
version = "0.1.0"
edition = "2021"
description = "层合迹：LSM tombstone、范围删除与压实选择审阅（离线案例 / 可重放证据）"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
tower = { version = "0.5", features = ["util"] }

[lib]
name = "lsm_trace"
path = "src/lib.rs"

[[bin]]
name = "lsm-trace"
path = "src/main.rs"
