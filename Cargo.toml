[package]
name = "lsm-review"
version = "0.1.0"
edition = "2021"
description = "层合迹：LSM tombstone、范围删除与压实选择审阅（本地 LSM/压实/墓碑语义应用）"

[lib]
name = "lsm_review"
path = "src/lib.rs"

[[bin]]
name = "lsm-review"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
