[package]
name = "lsm-audit"
version = "0.1.0"
edition = "2021"
description = "层合迹：LSM tombstone、范围删除与压实选择审阅（离线案例包 + 可重放证据）"

[lib]
name = "lsm_audit"
path = "src/lib.rs"

[[bin]]
name = "lsm-audit"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
