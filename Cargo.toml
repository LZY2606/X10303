[package]
name = "lsm-compaction-review"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lsm-review"
path = "src/main.rs"

[dependencies]
axum = "0.7.9"
tokio = { version = "1.48.0", features = ["full"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.5.60", features = ["derive"] }
thiserror = "1.0.69"
sha2 = "0.10.9"
crc32fast = "1.5.2"
hex = "0.4.3"
