[package]
name = "cengheji"
version = "0.1.0"
edition = "2021"
description = "层合迹：LSM tombstone、范围删除与压实选择审阅（离线案例包 + Web 复核）"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
sha2 = "0.11"
hex = "0.4"

[profile.dev]
opt-level = 0

[[bin]]
name = "cengheji"
path = "src/main.rs"
